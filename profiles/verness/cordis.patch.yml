# GENERATED by scripts/verness.mjs from verness.config.json - do not edit by hand.
# Regenerate with `./turn_on.sh sync` (or .\turn_on.ps1 sync). It stays committed so
# reviewers see the composed tree, but verness.config.json is the source of truth.

- insert:
    - id: verness-spike
      name: '@verness/spike'
    # Model routes. No adapter of ours is needed: dsh-llm-pi-ai serves hand-declared
    # OpenAI-compatible gateways given api + baseURL + a non-empty models list.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          ollama-local:
            displayName: 'Qwen3 0.6B (local, Hugging Face GGUF)'
            apiKeyEnv: OLLAMA_API_KEY
            api: openai-completions
            baseURL: 'http://127.0.0.1:11434/v1'
            defaultContextWindow: 32768
            defaultMaxTokens: 4096
            models:
              - id: 'hf.co/Qwen/Qwen3-0.6B-GGUF:Q8_0'
                name: 'Qwen3 0.6B (local, Hugging Face GGUF)'
                contextWindow: 32768
                reasoningEfforts: false

# A patch replaces the targeted row config wholesale, so every field is restated.
- id: agent-default-model
  config:
    provider: ollama-local
    model: 'hf.co/Qwen/Qwen3-0.6B-GGUF:Q8_0'

# Persona "generalist" + tips, injected through the existing system-prompt seam.
- id: system-prompt
  config:
    personaPrefix: 'You are a careful engineering assistant working inside the VerNess harness.'
    personaSuffix: |-
      State what you verified and what you assumed. Never claim a command succeeded unless you ran it.
      - Working directory is the VerNess repo; upstream/ is a read-only submodule.
      - Prefer small, verifiable steps over long plans.
      Your working directory is {{cwd}}.

- id: tools
  config:
    mode: native
