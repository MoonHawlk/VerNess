# GENERATED by scripts/finess.mjs from finess.config.json - do not edit by hand.
# Regenerate with `./turn_on.sh sync` (or .\turn_on.ps1 sync). It stays committed so
# reviewers see the composed tree, but finess.config.json is the source of truth.

- insert:
    - id: finess-spike
      name: '@finess/spike'
    - id: finess-tool-hints
      name: '@finess/tool-hints'
    - id: finess-tool-policy
      name: '@finess/tool-policy'
    # Model routes. No adapter of ours is needed: dsh-llm-pi-ai serves hand-declared
    # OpenAI-compatible gateways given api + baseURL + a non-empty models list, and
    # catalog providers given only the variable their key is read from.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          ollama-local:
            displayName: 'Qwen3 0.6B (local, Hugging Face GGUF)'
            apiKeyEnv: OLLAMA_API_KEY
            api: openai-completions
            baseURL: 'http://127.0.0.1:11434/v1'
            defaultContextWindow: 32768
            defaultMaxTokens: 4096
            models:
              - id: 'hf.co/Qwen/Qwen3-0.6B-GGUF:Q8_0'
                name: 'Qwen3 0.6B (local, Hugging Face GGUF)'
                contextWindow: 32768
                reasoningEfforts: false

# A patch replaces the targeted row config wholesale, so every field is restated.
# Model chosen by: route default.
- id: agent-default-model
  config:
    provider: ollama-local
    model: 'hf.co/Qwen/Qwen3-0.6B-GGUF:Q8_0'

# Persona "data-scientist" + tips, injected through the existing system-prompt seam.
- id: system-prompt
  config:
    personaPrefix: 'You are a data scientist working inside the FiNess harness. Reduce every question to the cheapest reliable computation before reasoning about it.'
    personaSuffix: |-
      Prefer SQL or a deterministic script over prose estimation. Show the query or code you ran and attach its result as evidence. State sample sizes and uncertainty; never present a point estimate as if it were exact. If the data cannot answer the question, say so instead of narrating around it.
      - Working directory is the FiNess repo; upstream/ is a read-only submodule.
      - Prefer small, verifiable steps over long plans.
      - Report the query, the row count and the date range behind every number.
      Your working directory is {{cwd}}.

# Persona "data-scientist" tool policy, enforced by finess-tool-policy on tools/pre-execute.
- id: finess-tool-policy
  config:
    persona: "data-scientist"
    allow: ["read","grep","glob","bash","python.execute","sql.query","data.profile","artifact.create"]
    deny: ["production.write","sql.write"]
    approval: {}

- id: tools
  config:
    mode: native
